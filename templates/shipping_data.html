<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shipping Data</title>
  <style>
    :root{
      --bg:#f3eee6;
      --panel:rgba(255,255,255,.95);
      --card:#fffdfa;
      --ink:#17252c;
      --muted:#667880;
      --line:rgba(23,47,58,.12);
      --accent:#0f5c6c;
      --accent-soft:#eef6f8;
      --up:#00a651;
      --down:#ef3d32;
      --shadow:0 20px 48px rgba(22,34,41,.10);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      color:var(--ink);
      font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      background:
        radial-gradient(circle at top left, rgba(15,92,108,.14), transparent 28%),
        radial-gradient(circle at top right, rgba(214,138,42,.12), transparent 24%),
        linear-gradient(180deg,#f7f3ec,#ece4da);
    }
    .shell{max-width:1560px;margin:0 auto;padding:24px 16px 56px}
    .hero,.section,.card,.metric-card,.text-card{
      background:var(--panel);
      border:1px solid rgba(255,255,255,.75);
      border-radius:24px;
      box-shadow:var(--shadow);
    }
    .hero,.section{padding:24px}
    .section{margin-top:18px}
    .card,.metric-card,.text-card{
      background:var(--card);
      border:1px solid var(--line);
      box-shadow:none;
    }
    .hero-head,.section-head,.toolbar{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
    h1,h2,h3,p{margin:0}
    h1{font-size:clamp(30px,4vw,42px)}
    h2{font-size:24px}
    h3{font-size:18px}
    .eyebrow{letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-size:12px;font-weight:700}
    .sub{color:var(--muted);font-size:13px;line-height:1.7}
    .toolbar{margin-top:14px}
    .button{
      border:0;
      border-radius:999px;
      background:linear-gradient(135deg,var(--accent),#14819a);
      color:#fff;
      padding:11px 17px;
      cursor:pointer;
      font-weight:700;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .button.secondary{background:#eef4f6;color:var(--accent)}
    .mail-grid,.metrics,.cards-grid{display:grid;gap:16px}
    .mail-grid{grid-template-columns:1fr 1fr}
    .metrics{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
    .cards-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .card{padding:18px}
    .metric-card{padding:16px}
    .text-card{padding:16px}
    .metric-value{font-size:24px;font-weight:800;margin-top:6px}
    .pill{
      display:inline-flex;
      align-items:center;
      padding:6px 10px;
      border-radius:999px;
      background:var(--accent-soft);
      color:var(--accent);
      font-size:12px;
      font-weight:700;
    }
    .up{color:var(--up);font-weight:700}
    .down{color:var(--down);font-weight:700}
    .table-wrap{
      overflow:auto;
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff;
      margin-top:14px;
    }
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
    th{background:#f7fafb;color:var(--muted);font-weight:700}
    tr:hover td{background:#fbfdfe}
    .content-block{
      margin-top:14px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px;
      line-height:1.8;
      white-space:pre-wrap;
      word-break:break-word;
      max-height:420px;
      overflow:auto;
    }
    .text-card .content-block{
      max-height:none;
      margin-top:12px;
      background:#fbfdfd;
    }
    .bullet-list{
      margin-top:12px;
      display:grid;
      gap:10px;
    }
    .bullet-item{
      padding:12px 14px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#fbfdfe;
      line-height:1.75;
    }
    .empty{
      padding:18px;
      border-radius:16px;
      background:#fff6eb;
      color:#8b5519;
      border:1px solid rgba(188,108,37,.16);
    }
    @media (max-width:1180px){
      .mail-grid,.cards-grid{grid-template-columns:1fr}
    }
    @media (max-width:760px){
      .shell{padding:14px 10px 36px}
      .hero,.section{padding:18px}
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div class="hero-head">
        <div>
          <div class="eyebrow">Shipping Data</div>
          <h1>Shipping Data</h1>
        </div>
        <div class="sub" id="status">正在加载</div>
      </div>
      <div class="toolbar">
        <button id="refreshBtn" class="button">刷新数据</button>
        <button id="syncBtn" class="button secondary">手动同步附件</button>
        <a class="button secondary" href="/">返回首页</a>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <div>
          <div class="eyebrow">Mail Body</div>
          <h2>邮件正文</h2>
        </div>
        <div class="sub" id="mailMeta">暂无邮件</div>
      </div>
      <div id="mailRoot" class="mail-grid" style="margin-top:18px"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <div>
          <div class="eyebrow">Structured Data</div>
          <h2>数据展示</h2>
        </div>
      </div>
      <div id="categoryRoot" style="margin-top:18px"></div>
    </section>
  </div>

  <script>
    const DATA_URL = "/api/shipping-data";
    const SYNC_URL = "/api/shipping-data/sync";
    const ENABLE_SYNC = true;

    const esc = (value) => {
      const div = document.createElement("div");
      div.textContent = value ?? "";
      return div.innerHTML;
    };
    const maybe = (value) => value === null || value === undefined || value === "" ? "-" : value;
    const signClass = (value) => {
      if (value === null || value === undefined) return "";
      const text = String(value).trim();
      if (text.startsWith("-")) return "down";
      if (text.startsWith("+")) return "up";
      return "";
    };
    const timeText = (value) => value ? String(value).replace("T", " ").slice(0, 16) : "-";
    const formatLongText = (value) => {
      if (value === null || value === undefined) return "-";
      return String(value)
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .replace(/\s+\[(?=[^\]]+\])/g, "\n\n[")
        .replace(/\s+(Market Comments|Recent Fixtures|Physical Markets|Baltic Routes|Exchange Rates|Freight Futures|Bunker Prices|TIMECHARTER|VOYAGES|ATLANTIC:|PACIFIC:|MID EAST:|INDIAN OCEAN:|ECSA:|US GULF:)/g, "\n\n$1")
        .replace(/([a-z0-9%])\. ([A-Z])/g, "$1.\n\n$2")
        .trim();
    };

    function renderTable(table) {
      if (!table || !table.rows || !table.rows.length) return "";
      return `
        <div class="table-wrap">
          <table>
            <thead><tr>${table.columns.map((col) => `<th>${esc(col)}</th>`).join("")}</tr></thead>
            <tbody>
              ${table.rows.map((row) => `<tr>${row.map((cell) => `<td class="${signClass(cell)}">${esc(maybe(cell))}</td>`).join("")}</tr>`).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderMetrics(metrics) {
      if (!metrics || !metrics.length) return "";
      return `
        <div class="metrics" style="margin-top:14px">
          ${metrics.map((item) => `
            <div class="metric-card">
              <div class="sub">${esc(maybe(item.label))}</div>
              <div class="metric-value">${esc(maybe(item.value))}</div>
              ${item.change ? `<div class="sub ${signClass(item.change)}">${esc(item.change)}</div>` : ""}
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderTextCards(cards) {
      if (!cards || !cards.length) return "";
      return `
        <div class="cards-grid" style="margin-top:14px">
          ${cards.map((card) => `
            <div class="text-card">
              <div class="pill">${esc(maybe(card.title))}</div>
              <div class="bullet-list">
                ${splitSummary(card.content).map((line) => `<div class="bullet-item">${esc(line)}</div>`).join("")}
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function splitSummary(text) {
      const parts = String(text || "")
        .replace(/\n+/g, " ")
        .split(/(?<=[.!?。；;])\s+/)
        .map((item) => item.trim())
        .filter(Boolean);
      return (parts.length ? parts : [text]).slice(0, 4);
    }

    function normalizeLines(text) {
      return String(text || "")
        .split(/\n+/)
        .map((line) => line.trim())
        .filter(Boolean);
    }

    function extractMailMetrics(text) {
      const rows = [];
      const patterns = [
        ["Baltic Dry Index", /Baltic Dry Index:\s*([0-9,]+)\s*\(([-+0-9,]+)\)/i],
        ["Baltic Capesize Index", /Baltic Capesize Index:\s*([0-9,]+)\s*\(([-+0-9,]+)\)/i],
        ["Baltic Panamax Index", /Baltic Panamax Index:\s*([0-9,]+)\s*\(([-+0-9,]+)\)/i],
        ["Baltic Supramax Index", /Baltic Supramax Index:\s*([0-9,]+)\s*\(([-+0-9,]+)\)/i],
        ["Baltic Handysize Index", /Baltic Handysize Index:\s*([0-9,]+)\s*\(([-+0-9,]+)\)/i],
      ];
      for (const [label, pattern] of patterns) {
        const match = String(text || "").match(pattern);
        if (match) rows.push([label, match[1], match[2]]);
      }
      return { columns: ["项目", "数值", "涨跌"], rows };
    }

    function extractMailSections(text) {
      const names = ["CAPESIZE", "PANAMAX", "SUPRAMAX", "HANDYSIZE", "Atlantic", "Pacific"];
      const source = String(text || "");
      const sections = [];
      for (let i = 0; i < names.length; i++) {
        const name = names[i];
        const regex = new RegExp(`(?:^|\\n)${name}\\n`, "i");
        const match = regex.exec(source);
        if (!match) continue;
        const start = match.index + match[0].length;
        let end = source.length;
        for (let j = 0; j < names.length; j++) {
          if (i === j) continue;
          const nextRegex = new RegExp(`(?:^|\\n)${names[j]}\\n`, "ig");
          nextRegex.lastIndex = start;
          const next = nextRegex.exec(source);
          if (next && next.index < end) end = next.index;
        }
        const content = formatLongText(source.slice(start, end));
        if (content) sections.push({ title: name, content });
      }
      return sections.slice(0, 6);
    }

    function renderHero(latestMail) {
      document.getElementById("mailMeta").textContent = latestMail ? `接收时间 ${timeText(latestMail.received_at)}` : "暂无邮件";
    }

    function renderMail(latestMail) {
      const root = document.getElementById("mailRoot");
      if (!latestMail) {
        root.innerHTML = `<div class="empty">当前没有可展示的邮件内容。</div>`;
        return;
      }
      const metricTable = extractMailMetrics(latestMail.body_text || "");
      const sections = extractMailSections(latestMail.body_text || "");
      root.innerHTML = `
        <article class="card">
          <div class="section-head">
            <h3>邮件指标</h3>
            <div class="pill">接收于 ${esc(timeText(latestMail.received_at))}</div>
          </div>
          ${metricTable.rows.length ? renderTable(metricTable) : `<div class="content-block">${esc(formatLongText(latestMail.body_text || latestMail.snippet || latestMail.body_summary))}</div>`}
        </article>
        <article class="card">
          <div class="section-head">
            <h3>重点文本</h3>
            <div class="pill">正文分段</div>
          </div>
          ${sections.length ? renderTextCards(sections) : `<div class="content-block">${esc(formatLongText(latestMail.body_text || latestMail.snippet || latestMail.body_summary))}</div>`}
        </article>
      `;
    }

    function renderCategories(payload) {
      const root = document.getElementById("categoryRoot");
      const categories = payload.attachment_categories || [];
      if (!categories.length) {
        root.innerHTML = `<div class="empty">当前没有结构化附件数据。</div>`;
        return;
      }
      root.innerHTML = categories.map((category) => `
        <section class="section" style="margin-top:0">
          <div class="section-head">
            <div>
              <div class="eyebrow">Category</div>
              <h2>${esc(category.name)}</h2>
            </div>
          </div>
          <div style="margin-top:18px">
            ${category.items.map((item) => `
              <article class="card" style="margin-top:16px">
                <div class="section-head">
                  <div class="pill">${esc(maybe(item.report_type))}</div>
                  <div class="sub">接收时间 ${esc(timeText(item.received_at))}</div>
                </div>
                ${item.summary ? `<div class="content-block">${esc(item.summary)}</div>` : ""}
                ${renderMetrics(item.headline_metrics)}
                ${renderTextCards(item.selected_cards)}
                ${renderTable(item.table)}
              </article>
            `).join("")}
          </div>
        </section>
      `).join("");
    }

    function renderAll(payload) {
      const latestMail = (payload.items || [])[0];
      renderHero(latestMail);
      renderMail(latestMail);
      renderCategories(payload);
    }

    async function loadData() {
      document.getElementById("status").textContent = "正在加载";
      try {
        const response = await fetch(`${DATA_URL}?ts=${Date.now()}`, { cache: "no-store" });
        const payload = await response.json();
        renderAll(payload);
        document.getElementById("status").textContent = "已加载";
      } catch (error) {
        document.getElementById("status").textContent = "加载失败";
        const html = `<div class="empty">加载失败: ${esc(String(error))}</div>`;
        document.getElementById("mailRoot").innerHTML = html;
        document.getElementById("categoryRoot").innerHTML = html;
      }
    }

    async function syncData() {
      if (!ENABLE_SYNC) return;
      const btn = document.getElementById("syncBtn");
      btn.disabled = true;
      document.getElementById("status").textContent = "正在同步";
      try {
        const response = await fetch(SYNC_URL, { method: "POST", headers: { "Content-Type": "application/json" } });
        const payload = await response.json();
        if (!response.ok || payload.status !== "ok") {
          throw new Error(payload.message || "同步失败");
        }
        await loadData();
      } catch (error) {
        document.getElementById("status").textContent = `同步失败: ${error}`;
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", loadData);
    const syncBtn = document.getElementById("syncBtn");
    if (syncBtn) syncBtn.addEventListener("click", syncData);
    loadData();
  </script>
</body>
</html>
