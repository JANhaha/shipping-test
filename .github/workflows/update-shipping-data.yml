name: Update Shipping Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: shipping-data-refresh
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUTF8: "1"

jobs:
  update-shipping-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: stable
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Write Gmail credentials
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          if [ -n "$GMAIL_CREDENTIALS_JSON" ]; then
            printf '%s' "$GMAIL_CREDENTIALS_JSON" > credentials/gmail_credentials.json
          else
            echo "warning: GMAIL_CREDENTIALS_JSON is empty"
          fi
          if [ -n "$GMAIL_TOKEN_JSON" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > credentials/gmail_token.json
          else
            echo "warning: GMAIL_TOKEN_JSON is empty"
          fi

      - name: Run full refresh pipeline
        run: python scripts/full_refresh.py

      - name: Commit updated shipping data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/shipping_data.json docs/data/map_data.json docs/data/dashboard.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update shipping data"
          git pull --rebase origin stable
          git push origin HEAD:stable
