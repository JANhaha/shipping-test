name: Update Shipping Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update-shipping-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Gmail credentials
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          printf '%s' "$GMAIL_CREDENTIALS_JSON" > credentials/gmail_credentials.json
          printf '%s' "$GMAIL_TOKEN_JSON" > credentials/gmail_token.json

      - name: Sync Gmail shipping data
        run: python scripts/sync_gmail_shipping_data.py

      - name: Export static shipping data
        run: python scripts/export_shipping_data_static.py

      - name: Commit updated shipping data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/shipping_data.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update shipping data"
          git push
