name: Update Shipping Data

on:
  workflow_dispatch:
    inputs:
      gmail_lookback_days:
        description: "Gmail lookback days for manual force refresh"
        required: false
        default: "30"
  schedule:
    # GitHub scheduled jobs are best-effort and can be delayed or skipped.
    # Run every 5 minutes so missed slots recover quickly.
    - cron: "*/5 * * * *"

concurrency:
  group: shipping-data-refresh
  # Serialize manual and scheduled refreshes so a force refresh is never
  # canceled by a scheduled run that starts a few seconds later.
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHONUTF8: "1"
  REQUIRE_GMAIL_SYNC: "false"

jobs:
  update-shipping-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      DATA_REFRESH_INTERVAL_MINUTES: "5"
      GMAIL_LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.gmail_lookback_days || '7' }}
      GMAIL_BROAD_LOOKBACK_DAYS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: stable
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Write Gmail credentials
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          mkdir -p credentials
          if [ -n "$GMAIL_CREDENTIALS_JSON" ]; then
            printf '%s' "$GMAIL_CREDENTIALS_JSON" > credentials/gmail_credentials.json
          else
            echo "warning: GMAIL_CREDENTIALS_JSON is empty"
          fi
          if [ -n "$GMAIL_TOKEN_JSON" ]; then
            printf '%s' "$GMAIL_TOKEN_JSON" > credentials/gmail_token.json
          else
            echo "warning: GMAIL_TOKEN_JSON is empty"
          fi

      - name: Run full refresh pipeline
        run: python scripts/full_refresh.py

      - name: Commit updated shipping data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add docs/data/shipping_data.json docs/data/map_data.json docs/data/dashboard.json docs/data/refresh_status.json
          if git diff --cached --quiet; then
            echo "No shipping data changes to publish."
            exit 0
          fi
          git commit -m "chore: update shipping data"
          for attempt in 1 2 3 4; do
            if git fetch origin stable && git rebase origin/stable && git push origin HEAD:stable; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 15))
          done
          exit 1

      - name: Report Gmail sync health
        run: python scripts/check_refresh_health.py
